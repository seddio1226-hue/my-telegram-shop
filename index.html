<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Noir Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f1216;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 15px;
            -webkit-user-select: none;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #2481cc; font-size: 22px; margin: 0; }
        .header p { color: #888; font-size: 13px; }
        
        #shop-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #1c1f26;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #2d323e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #2d323e;
        }
        .card h2 { font-size: 14px; margin: 5px 0; color: #fff; text-align: left; }
        .price { color: #31b545; font-weight: bold; font-size: 15px; margin: 5px 0 10px 0; }
        .buy-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 8px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
        .buy-btn:active { transform: scale(0.96); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Digital Noir</h1>
        <p>Выберите товар для покупки</p>
    </div>

    <div id="shop-container">
        </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ЗАМЕНИ ЭТИ ДАННЫЕ НА СВОИ ИЗ SUPABASE SETTINGS -> API
        const SUPABASE_URL = 'https://vvinefqzoeqlndncxlff.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2aW5lZnF6b2VxbG5kbmN4bGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NjUzMjYsImV4cCI6MjA4NzU0MTMyNn0.McwnrFtCdLH6-NGAmzuUcx1JSVxYnC9dtDViGUi1S1M';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchProducts() {
            const { data, error } = await _supabase.from('products').select('*');
            if (error) {
                console.error(error);
                return;
            }
            const container = document.getElementById('shop-container');
            container.innerHTML = '';
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                // Если в базе нет image_url, используем картинку-заглушку
                const img = item.image_url || 'https://via.placeholder.com/150/2d323e/ffffff?text=Digital+Noir';
                
                card.innerHTML = `
                    <img src="${img}" alt="${item.name}">
                    <h2>${item.name}</h2>
                    <div class="price">${item.price} ₽</div>
                    <button class="buy-btn" onclick="sendOrder('${item.name}')">Купить</button>
                `;
                container.appendChild(card);
            });
        }

        function sendOrder(name) {
            // Форматируем имя для n8n: "CS2 Prime" -> "buy_cs2_prime"
            const cmd = "buy_" + name.toLowerCase().replace(/ /g, "_");
            tg.sendData(cmd);
            tg.close();
        }

        fetchProducts();
    </script>
</body>
</html>
