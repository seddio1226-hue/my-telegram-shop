<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Noir OS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #000000;
            --accent: #007aff; /* Apple Blue */
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* Чтобы не было скролла при перетаскивании */
            height: 100vh;
        }

        /* Фоновое свечение */
        .bg-glow {
            position: fixed;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(0,122,255,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        /* Контейнер для плавающих пузырей */
        #viewport {
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1000px;
            touch-action: none; /* Важно для кастомного перетаскивания */
        }

        #bubble-field {
            display: flex; flex-wrap: wrap;
            width: 400px; justify-content: center; gap: 20px;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        .category-bubble {
            width: 100px; height: 100px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 10px; box-sizing: border-box;
            cursor: pointer;
        }

        .category-bubble:active { transform: scale(0.85); background: var(--accent); }

        /* Сетка товаров */
        #shop-view {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            display: none; flex-direction: column;
            overflow-y: auto; padding: 20px; box-sizing: border-box;
            z-index: 100; animation: fadeIn 0.4s ease;
        }

        .card {
            background: var(--glass);
            border-radius: 20px; padding: 15px;
            margin-bottom: 15px; border: 1px solid var(--border);
            display: flex; gap: 15px; align-items: center;
        }

        .card img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .card-info { flex: 1; }
        .card-info h2 { font-size: 16px; margin: 0 0 5px 0; }
        .price { color: #31b545; font-weight: bold; }

        .buy-btn {
            background: var(--accent); color: #fff; border: none;
            padding: 8px 15px; border-radius: 12px; font-weight: bold;
        }

        .back-btn {
            background: var(--glass); color: #fff; border: 1px solid var(--border);
            padding: 10px; border-radius: 50%; width: 40px; height: 40px;
            margin-bottom: 20px; cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div id="viewport">
        <div id="bubble-field">
            </div>
    </div>

    <div id="shop-view">
        <button class="back-btn" onclick="closeShop()">✕</button>
        <div id="products-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = 'https://vvinefqzoeqlndncxlff.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2aW5lZnF6b2VxbG5kbmN4bGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NjUzMjYsImV4cCI6MjA4NzU0MTMyNn0.McwnrFtCdLH6-NGAmzuUcx1JSVxYnC9dtDViGUi1S1M';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let field = document.getElementById('bubble-field');
        let currentX = 0, currentY = 0;
        let targetX = 0, targetY = 0;

        // Физика плавного движения (LERP)
        function animate() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            field.style.transform = `translate(${currentX}px, ${currentY}px)`;
            requestAnimationFrame(animate);
        }
        animate();

        // Обработка касаний
        window.addEventListener('pointermove', (e) => {
            if (e.buttons === 1) { // Если нажато
                targetX += e.movementX;
                targetY += e.movementY;
            }
        });

        async function init() {
            const { data, error } = await _supabase.from('products').select('*');
            if (error) return;
            allProducts = data;
            renderBubbles();
        }

        function renderBubbles() {
            const categories = [...new Set(allProducts.map(p => p.category || 'Shop'))];
            field.innerHTML = '';
            categories.forEach(cat => {
                const b = document.createElement('div');
                b.className = 'category-bubble';
                b.innerText = cat;
                b.onclick = () => openShop(cat);
                field.appendChild(b);
            });
        }

        function openShop(cat) {
            const view = document.getElementById('shop-view');
            const list = document.getElementById('products-list');
            view.style.display = 'flex';
            list.innerHTML = '';
            
            const filtered = allProducts.filter(p => (p.category || 'Shop') === cat);
            filtered.forEach(item => {
                const img = item.image_url || 'https://via.placeholder.com/80/222/fff?text=Item';
                list.innerHTML += `
                    <div class="card">
                        <img src="${img}">
                        <div class="card-info">
                            <h2>${item.name}</h2>
                            <div class="price">${item.price} ₽</div>
                        </div>
                        <button class="buy-btn" onclick="sendOrder('${item.name}')">Купить</button>
                    </div>
                `;
            });
        }

        function closeShop() { document.getElementById('shop-view').style.display = 'none'; }

        function sendOrder(name) {
            const cmd = "buy_" + name.toLowerCase().replace(/ /g, "_");
            tg.sendData(cmd);
            tg.close();
        }

        init();
    </script>
</body>
</html>
