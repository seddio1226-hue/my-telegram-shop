<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Noir - Nano Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --accent: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.2);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-title: 'Orbitron', sans-serif;
            --font-main: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: var(--font-main);
            margin: 0; padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* АНИМИРОВАННЫЙ ФОН - 6 РАЗНЫХ КРУЖКОВ */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.15;
            animation: move infinite alternate ease-in-out;
        }
        .b1 { width: 150px; height: 150px; background: var(--accent); top: 10%; left: 10%; animation-duration: 15s; }
        .b2 { width: 250px; height: 250px; background: #7000ff; bottom: 10%; right: -50px; animation-duration: 20s; animation-delay: -2s; }
        .b3 { width: 100px; height: 100px; background: #ff00ff; top: 40%; left: 70%; animation-duration: 12s; opacity: 0.1; }
        .b4 { width: 80px; height: 80px; background: var(--accent); bottom: 40%; left: 20%; animation-duration: 18s; animation-delay: -5s; }
        .b5 { width: 200px; height: 200px; background: #0044ff; top: -50px; right: 10%; animation-duration: 25s; }
        .b6 { width: 120px; height: 120px; background: #00ffaa; bottom: 20%; left: 50%; animation-duration: 22s; opacity: 0.05; }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 80px) scale(1.2); }
        }

        /* ШАПКА */
        header {
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-family: var(--font-title); font-size: 16px; margin: 0; letter-spacing: 2px; color: var(--accent); }
        
        .nav-btn {
            background: var(--glass); border: 1px solid var(--glass-border);
            color: #fff; width: 35px; height: 35px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР */
        .container { padding: 20px; }

        .view { display: none; animation: fadeIn 0.4s ease-out; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* КАТЕГОРИИ (Сетка 3х3) */
        .category-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .cat-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            aspect-ratio: 1/1; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; font-size: 11px; font-weight: 600;
            transition: 0.3s; cursor: pointer; text-transform: uppercase;
        }
        .cat-card:active { transform: scale(0.9); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-dim); }

        /* КАРТОЧКИ ТОВАРОВ */
        .product-list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .p-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 12px; position: relative;
        }
        .p-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 15px; margin-bottom: 12px; }
        .p-card h3 { margin: 0 0 5px 0; font-size: 18px; font-family: var(--font-title); }
        .p-card .price { color: var(--accent); font-weight: bold; font-size: 20px; margin-bottom: 10px; }
        .p-card .desc { color: #888; font-size: 13px; line-height: 1.3; margin-bottom: 15px; }
        
        .buy-btn {
            width: 100%; padding: 12px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, #00d2ff, #7000ff);
            color: #fff; font-family: var(--font-title); font-weight: bold; font-size: 14px;
        }

        /* ЛИЧНЫЙ КАБИНЕТ */
        .profile-header { text-align: center; margin-bottom: 25px; }
        .profile-header .avatar { 
            width: 70px; height: 70px; background: var(--accent-dim); 
            border-radius: 50%; margin: 0 auto 10px; border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-item { background: var(--glass); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); }
        .stat-item span { display: block; font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-item b { font-size: 18px; color: var(--accent); }

        .menu-list { background: var(--glass); border-radius: 15px; overflow: hidden; }
        .menu-item { 
            padding: 15px 20px; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; 
        }
        .menu-item:last-child { border-bottom: none; }

        .back-btn { margin-bottom: 15px; color: var(--accent); cursor: pointer; display: inline-block; }

        #loading { text-align: center; padding: 40px; color: var(--accent); font-family: var(--font-title); }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob b1"></div><div class="blob b2"></div>
        <div class="blob b3"></div><div class="blob b4"></div>
        <div class="blob b5"></div><div class="blob b6"></div>
    </div>

    <header>
        <h1 onclick="showView('home')">DIGITAL NOIR</h1>
        <div class="nav-btn" onclick="showView('profile')">👤</div>
    </header>

    <div class="container">
        <div id="loading">ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ...</div>

        <div id="home" class="view">
            <div class="category-grid" id="catGrid"></div>
        </div>

        <div id="products" class="view">
            <div class="back-btn" onclick="showView('home')">← К категориям</div>
            <div class="product-list" id="productList"></div>
        </div>

        <div id="profile" class="view">
            <div class="back-btn" onclick="showView('home')">← Назад</div>
            <div class="profile-header">
                <div class="avatar">👤</div>
                <h2 id="userName">User</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><span>Баланс</span><b>0.00 ₽</b></div>
                <div class="stat-item"><span>Заказов</span><b>0</b></div>
            </div>
            <div class="menu-list">
                <div class="menu-item">История покупок <span>›</span></div>
                <div class="menu-item">Поддержка <span>›</span></div>
                <div class="menu-item">Настройки <span>›</span></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#05070a';

        const SUPABASE_URL = 'https://vvinefqzoeqlndncxlff.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2aW5lZnF6b2VxbG5kbmN4bGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NjUzMjYsImV4cCI6MjA4NzU0MTMyNn0.McwnrFtCdLH6-NGAmzuUcx1JSVxYnC9dtDViGUi1S1M';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let storeData = [];

        async function init() {
            try {
                const { data, error } = await _supabase.from('products').select('*');
                if (error) throw error;
                
                storeData = data || [];
                document.getElementById('loading').style.display = 'none';
                
                if (tg.initDataUnsafe?.user) {
                    document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
                }

                renderHome();
            } catch (err) {
                document.getElementById('loading').innerHTML = "ОШИБКА ДОСТУПА К БАЗЕ";
                console.error(err);
            }
        }

        function renderHome() {
            const grid = document.getElementById('catGrid');
            const categories = [...new Set(storeData.map(p => (p.category || 'Общее').trim()))];
            
            grid.innerHTML = '';
            categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'cat-card';
                item.innerHTML = `<span>${cat}</span>`;
                item.onclick = () => showCategory(cat);
                grid.appendChild(item);
            });
            showView('home');
        }

        function showCategory(category) {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            const filtered = storeData.filter(p => (p.category || 'Общее').trim() === category);

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; opacity:0.5;">Товаров в этой категории пока нет</p>';
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'p-card';
                const img = p.image_url || 'https://via.placeholder.com/400x300/1a2a40/00f2ff?text=Digital+Noir';
                card.innerHTML = `
                    <img src="${img}">
                    <h3>${p.name}</h3>
                    <div class="price">${p.price} ₽</div>
                    <div class="desc">${p.description || 'Нет описания'}</div>
                    <button class="buy-btn" onclick="buy('${p.name}')">КУПИТЬ</button>
                `;
                list.appendChild(card);
            });
            showView('products');
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        function buy(name) {
            tg.sendData("buy_" + name);
            tg.showConfirm(`Вы хотите приобрести ${name}?`);
        }

        init();
    </script>
</body>
</html>
