<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Noir Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #2481cc;
            --glass: rgba(255, 255, 255, 0.1);
            --text-secondary: #888;
        }

        body {
            background: var(--bg);
            background-attachment: fixed;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Анимация появления */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .header {
            text-align: center;
            padding: 20px 0 10px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .category-screen {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 20px;
            padding: 20px;
            flex-grow: 1;
        }

        .category-bubble {
            width: 110px;
            height: 110px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            transition: all 0.3s ease;
            padding: 15px;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        .category-bubble:active { transform: scale(0.9); background: var(--accent); }

        #shop-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
            animation: popIn 0.3s ease-out;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 8px;
        }

        .card h2 { font-size: 14px; margin: 5px 0; height: 34px; overflow: hidden; }
        .price { color: #31b545; font-weight: bold; font-size: 16px; margin-bottom: 10px; }

        .buy-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(36, 129, 204, 0.3);
        }

        /* Оферта */
        .offer-text {
            padding: 20px;
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.4;
        }

        .back-btn {
            display: none;
            margin: 15px auto;
            background: var(--glass);
            border: 1px solid var(--accent);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Digital Noir</h1>
    </div>

    <button class="back-btn" id="backBtn" onclick="showCategories()">← Назад к категориям</button>
    
    <div class="category-screen" id="categoryMenu">
        </div>

    <div id="shop-container"></div>

    <div class="offer-text" id="offerBlock">
        Нажимая кнопку «Купить», вы принимаете условия публичной оферты и политики конфиденциальности. 
        Весь товар является цифровым и доставляется автоматически после подтверждения оплаты.
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = 'https://vvinefqzoeqlndncxlff.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2aW5lZnF6b2VxbG5kbmN4bGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NjUzMjYsImV4cCI6MjA4NzU0MTMyNn0.McwnrFtCdLH6-NGAmzuUcx1JSVxYnC9dtDViGUi1S1M';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allProducts = [];

        async function init() {
            const { data, error } = await _supabase.from('products').select('*');
            if (error) return;
            allProducts = data;
            renderCategoryMenu();
        }

        function renderCategoryMenu() {
            const menu = document.getElementById('categoryMenu');
            const categories = [...new Set(allProducts.map(p => p.category || 'Прочее'))];
            menu.innerHTML = '';
            categories.forEach((cat, index) => {
                const bubble = document.createElement('div');
                bubble.className = 'category-bubble';
                bubble.style.animationDelay = `${index * 0.05}s`;
                bubble.innerText = cat;
                bubble.onclick = () => showProducts(cat);
                menu.appendChild(bubble);
            });
            document.getElementById('offerBlock').classList.remove('hidden');
        }

        function showProducts(category) {
            document.getElementById('categoryMenu').classList.add('hidden');
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('offerBlock').classList.add('hidden'); // Скрываем оферту в списке товаров для удобства
            
            const container = document.getElementById('shop-container');
            container.style.display = 'grid';
            container.innerHTML = '';

            const filtered = allProducts.filter(p => (p.category || 'Прочее') === category);
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const img = item.image_url || 'https://via.placeholder.com/150/2d323e/ffffff?text=Item';
                card.innerHTML = `
                    <img src="${img}">
                    <h2>${item.name}</h2>
                    <div class="price">${item.price} ₽</div>
                    <button class="buy-btn" onclick="sendOrder('${item.name}')">Купить</button>
                `;
                container.appendChild(card);
            });
        }

        function showCategories() {
            document.getElementById('categoryMenu').classList.remove('hidden');
            document.getElementById('shop-container').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('offerBlock').classList.remove('hidden');
        }

        function sendOrder(name) {
            const cmd = "buy_" + name.toLowerCase().replace(/ /g, "_");
            tg.sendData(cmd);
            tg.close();
        }

        init();
    </script>
</body>
</html>
