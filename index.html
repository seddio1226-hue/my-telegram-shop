<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Noir OS - Hybrid v2</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.2);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg: #05070a;
            --font-title: 'Orbitron', sans-serif;
            --font-main: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: var(--font-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* АНИМИРОВАННЫЙ ФОН */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.15;
            animation: move infinite alternate ease-in-out;
        }
        .b1 { width: 150px; height: 150px; background: var(--accent); top: 10%; left: 10%; animation-duration: 15s; }
        .b2 { width: 250px; height: 250px; background: #7000ff; bottom: 10%; right: -50px; animation-duration: 20s; animation-delay: -2s; }
        .b3 { width: 100px; height: 100px; background: #ff00ff; top: 40%; left: 70%; animation-duration: 12s; opacity: 0.1; }
        .b4 { width: 80px; height: 80px; background: var(--accent); bottom: 40%; left: 20%; animation-duration: 18s; animation-delay: -5s; }
        .b5 { width: 200px; height: 200px; background: #0044ff; top: -50px; right: 10%; animation-duration: 25s; }
        .b6 { width: 120px; height: 120px; background: #00ffaa; bottom: 20%; left: 50%; animation-duration: 22s; opacity: 0.05; }

        @keyframes move { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(60px, 90px) scale(1.2); } 
        }

        /* РЕЖИМЫ */
        body.square-mode { --font-title: 'Orbitron', sans-serif; --font-main: 'Rajdhani', sans-serif; }
        body.round-mode { --font-title: 'Montserrat', sans-serif; --font-main: 'Montserrat', sans-serif; }
        
        body.round-mode .nav-bar { display: none !important; }
        body.round-mode .container { padding-bottom: 40px; }

        header {
            padding: 20px; text-align: center;
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-family: var(--font-title); font-size: 18px; margin: 0; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }

        .container { padding: 20px; padding-bottom: 100px; }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* КЛЮЧЕВАЯ АНИМАЦИЯ ВСПЛЫТИЯ */
        @keyframes popIn { 
            from { transform: scale(0.5); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }

        /* ГРИД КАТЕГОРИЙ */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .cat-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            aspect-ratio: 1/1; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 10px; font-weight: bold;
            transition: 0.3s; cursor: pointer; text-transform: uppercase; padding: 5px;
            /* Применяем анимацию ко всем карточкам */
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .cat-card:active { transform: scale(0.95); border-color: var(--accent); }

        /* ПУЗЫРИ (ROUND MODE) */
        .round-mode .category-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; align-items: center; min-height: 20vh; }
        .round-mode .cat-card { 
            width: 110px; height: 110px; border-radius: 50%; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.08);
        }

        /* ТОВАРЫ */
        .product-list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .round-mode .product-list { grid-template-columns: 1fr 1fr; }
        .p-card { 
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 12px;
            animation: popIn 0.4s ease-out both;
        }
        .p-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 15px; margin-bottom: 10px; }
        .price { color: var(--accent); font-weight: bold; font-size: 18px; margin: 8px 0; }
        .buy-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; background: linear-gradient(90deg, #00d2ff, #7000ff); color: #fff; font-weight: bold; }

        /* НАВИГАЦИЯ */
        .back-btn { margin-bottom: 15px; color: var(--accent); cursor: pointer; display: none; font-family: var(--font-title); font-size: 12px; }
        
        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 65px; background: rgba(5,7,10,0.9);
            border-radius: 20px; border: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item { font-size: 10px; color: #555; text-align: center; text-transform: uppercase; font-weight: bold; }
        .nav-item.active { color: var(--accent); }

        .stat-item { background: var(--glass); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); margin-bottom: 10px; }
        .menu-list { background: var(--glass); border-radius: 15px; overflow: hidden; border: 1px solid var(--glass-border); }
        .menu-item { padding: 15px 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: #111; border: 1px solid var(--accent); border-radius: 25px; padding: 25px; width: 85%; max-width: 400px; }
    </style>
</head>
<body class="square-mode">

    <div class="ambient-bg" id="ambientBg">
        <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
        <div class="blob b4"></div><div class="blob b5"></div><div class="blob b6"></div>
    </div>

    <header><h1 id="mainTitle">Digital Noir</h1></header>

    <div class="container">
        <div class="back-btn" id="globalBack" onclick="app.back()">← <span id="txt-back">НАЗАД</span></div>

        <div id="view-home" class="view active">
            <div class="category-grid" id="catGrid"></div>
        </div>

        <div id="view-products" class="view">
            <div class="product-list" id="productList"></div>
        </div>

        <div id="view-profile" class="view">
            <div class="stat-item"><span>Баланс</span><b id="user-balance">0.00 ₽</b></div>
            <div class="menu-list">
                <div class="menu-item">История покупок <span>›</span></div>
                <div class="menu-item">Поддержка <span>›</span></div>
            </div>
        </div>

        <div id="view-promo" class="view">
            <div class="stat-item" style="border-left: 3px solid var(--accent);">
                <b>Кэшбэк 15%</b><br><small>При оплате через USDT сегодня</small>
            </div>
        </div>

        <div id="view-settings" class="view">
            <div class="menu-list">
                <div class="menu-item">
                    <span>Интерфейс</span>
                    <select onchange="app.setTheme(this.value)" id="themeSelector">
                        <option value="square">Nano (Square)</option>
                        <option value="round">Premium (Round)</option>
                    </select>
                </div>
                <div class="menu-item">
                    <span>Фон</span>
                    <div style="display:flex; gap:10px;">
                        <div class="dot" style="background:#05070a" onclick="app.setBg('black')"></div>
                        <div class="dot" style="background:radial-gradient(circle, #1a1a2e, #000)" onclick="app.setBg('radial')"></div>
                        <div class="dot" style="background:linear-gradient(45deg, #00f2ff, #7000ff); opacity:0.5" onclick="app.setBg('blobs')"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item" onclick="app.nav('view-promo')" id="m-promo">АКЦИИ</div>
        <div class="nav-item active" onclick="app.nav('view-home')" id="m-home">МАГАЗИН</div>
        <div class="nav-item" onclick="app.nav('view-profile')" id="m-prof">ПРОФИЛЬ</div>
        <div class="nav-item" onclick="app.nav('view-settings')" id="m-set">ОПЦИИ</div>
    </nav>

    <div class="modal-overlay" id="payModal">
        <div class="modal-content">
            <h3 id="modalTitle">Оплата</h3>
            <p id="modalPrice" class="price"></p>
            <button class="buy-btn" onclick="app.confirmPay()">ПОДТВЕРДИТЬ</button>
            <button class="buy-btn" onclick="app.closeModal()" style="background:none; border:1px solid #333; margin-top:10px">ОТМЕНА</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const _sb = supabase.createClient('https://vvinefqzoeqlndncxlff.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2aW5lZnF6b2VxbG5kbmN4bGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NjUzMjYsImV4cCI6MjA4NzU0MTMyNn0.McwnrFtCdLH6-NGAmzuUcx1JSVxYnC9dtDViGUi1S1M');

        const app = {
            state: { theme: 'square', history: ['view-home'], db: [], isHub: true },

            async init() {
                const { data } = await _sb.from('products').select('*');
                this.state.db = data || [];
                this.renderHome();
            },

            renderHome() {
                const grid = document.getElementById('catGrid');
                grid.innerHTML = '';
                
                if (this.state.theme === 'round' && this.state.isHub) {
                    const hub = [
                        { n: 'МАГАЗИН', a: () => { this.state.isHub = false; this.renderHome(); } },
                        { n: 'ПРОФИЛЬ', a: () => this.nav('view-profile') },
                        { n: 'АКЦИИ', a: () => this.nav('view-promo') },
                        { n: 'ОПЦИИ', a: () => this.nav('view-settings') }
                    ];
                    hub.forEach((i, idx) => {
                        const el = document.createElement('div');
                        el.className = 'cat-card';
                        el.innerText = i.n;
                        el.onclick = i.a;
                        el.style.animationDelay = `${idx * 0.07}s`; // ЗАДЕРЖКА ДЛЯ КРУГОВ
                        grid.appendChild(el);
                    });
                } else {
                    const cats = [...new Set(this.state.db.map(p => p.category || 'Общее'))];
                    cats.forEach((c, idx) => {
                        const el = document.createElement('div');
                        el.className = 'cat-card';
                        el.innerText = c;
                        el.onclick = () => this.renderProducts(c);
                        el.style.animationDelay = `${idx * 0.05}s`; // ЗАДЕРЖКА ДЛЯ КВАДРАТОВ
                        grid.appendChild(el);
                    });
                }
                this.updateUI();
            },

            renderProducts(cat) {
                this.nav('view-products');
                const list = document.getElementById('productList');
                list.innerHTML = '';
                this.state.db.filter(p => p.category === cat).forEach((p, idx) => {
                    const el = document.createElement('div');
                    el.className = 'p-card';
                    el.style.animationDelay = `${idx * 0.05}s`; // ЗАДЕРЖКА ДЛЯ ТОВАРОВ
                    el.innerHTML = `
                        <img src="${p.image_url || 'https://via.placeholder.com/150'}">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price} ₽</div>
                        <button class="buy-btn" onclick="app.openModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">КУПИТЬ</button>
                    `;
                    list.appendChild(el);
                });
            },

            nav(id) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(this.state.history[this.state.history.length-1] !== id) this.state.history.push(id);
                this.updateUI();
            },

            back() {
                if (this.state.theme === 'round' && !this.state.isHub && this.state.history[this.state.history.length-1] === 'view-home') {
                    this.state.isHub = true;
                    this.renderHome();
                    return;
                }
                if(this.state.history.length <= 1) return;
                this.state.history.pop();
                const prev = this.state.history[this.state.history.length-1];
                if (prev === 'view-home') this.state.isHub = true;
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(prev).classList.add('active');
                if (prev === 'view-home') this.renderHome();
                this.updateUI();
            },

            updateUI() {
                const cur = this.state.history[this.state.history.length-1];
                const isRoot = (cur === 'view-home' && this.state.isHub);
                document.getElementById('globalBack').style.display = isRoot ? 'none' : 'block';
                document.querySelectorAll('.nav-item').forEach(i => {
                    i.classList.remove('active');
                    if(i.id.includes(cur.split('-')[1])) i.classList.add('active');
                });
            },

            setTheme(t) {
                this.state.theme = t;
                document.body.className = t + '-mode';
                this.state.isHub = true;
                this.state.history = ['view-home'];
                this.nav('view-home');
                this.renderHome();
            },

            setBg(type) {
                const bg = document.getElementById('ambientBg');
                bg.style.display = (type === 'blobs') ? 'block' : 'none';
                document.body.style.background = (type === 'black') ? '#05070a' : 
                    (type === 'radial' ? 'radial-gradient(circle at center, #1a1a2e 0%, #000 100%)' : '#05070a');
            },

            openModal(p) {
                this.state.selected = p;
                document.getElementById('modalTitle').innerText = p.name;
                document.getElementById('modalPrice').innerText = p.price + ' ₽';
                document.getElementById('payModal').style.display = 'flex';
                tg.HapticFeedback.impactOccurred('medium');
            },

            closeModal() { document.getElementById('payModal').style.display = 'none'; },

            confirmPay() {
                tg.sendData("buy_" + this.state.selected.name);
                this.closeModal();
            }
        };

        app.init();
    </script>
</body>
</html>
