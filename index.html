<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Noir Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1a2a40 0%, #05070a 100%);
            --accent: #00f2ff;
            --accent-secondary: #7000ff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #8892b0;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-color: #05070a;
            color: var(--text-main);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Эффект безграничности: разбросанные круги */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            animation: float 25s infinite alternate ease-in-out;
        }

        .c1 { width: 300px; height: 300px; top: -100px; left: -100px; background: var(--accent); }
        .c2 { width: 400px; height: 400px; bottom: -150px; right: -150px; background: var(--accent-secondary); animation-delay: -5s; }
        .c3 { width: 200px; height: 200px; top: 40%; left: 80%; background: #ff00ff; opacity: 0.05; }
        .c4 { width: 150px; height: 150px; top: 10%; right: 20%; background: var(--accent); opacity: 0.05; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-family: var(--font-title);
            font-size: 20px;
            margin: 0;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: white;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .main-content { padding: 20px; }

        /* ИСПРАВЛЕННАЯ СЕТКА КАТЕГОРИЙ */
        .category-screen {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Строго 2 колонки */
            gap: 20px;
            padding: 10px 0;
        }

        .category-bubble {
            aspect-ratio: 1/1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: var(--font-title);
            font-size: 11px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(0,242,255,0); }
            50% { transform: scale(1.03); box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        }

        .category-bubble:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-5px);
        }

        /* КАРТОЧКИ ТОВАРОВ */
        #shop-container {
            display: none;
            grid-template-columns: 1fr; /* На мобилках лучше в одну колонку, если описание длинное */
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 15px;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .card h2 { font-family: var(--font-title); font-size: 18px; margin: 0 0 10px 0; }
        .price { color: var(--accent); font-family: var(--font-title); font-size: 20px; margin-bottom: 10px; }

        /* Раскрывающееся описание при наведении */
        .card-description {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s ease;
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.4;
        }

        .card:hover .card-description {
            max-height: 200px;
            opacity: 1;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--accent-secondary), var(--accent));
            color: white;
            font-family: var(--font-title);
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            display: none;
            margin-bottom: 20px;
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        .hidden { display: none !important; }
        
        /* Заглушка загрузки */
        #loader { text-align: center; padding: 50px; font-family: var(--font-title); color: var(--accent); }
    </style>
</head>
<body>

    <div class="bg-elements">
        <div class="bg-circle c1"></div>
        <div class="bg-circle c2"></div>
        <div class="bg-circle c3"></div>
        <div class="bg-circle c4"></div>
    </div>

    <div class="header">
        <h1>DIGITAL NOIR</h1>
        <button class="profile-btn" onclick="showProfile()">👤</button>
    </div>

    <div class="main-content">
        <button class="back-btn" id="backBtn" onclick="goBack()">← НАЗАД</button>
        
        <div id="loader">ЗАГРУЗКА СИСТЕМЫ...</div>

        <div class="category-screen" id="categoryMenu"></div>

        <div id="shop-container"></div>

        <div id="profile-page" class="hidden" style="text-align: center; padding: 40px 0;">
            <h2 style="font-family: var(--font-title);">ЛИЧНЫЙ КАБИНЕТ</h2>
            <p style="color: var(--text-dim);">История заказов пуста</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = 'https://vvinefqzoeqlndncxlff.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2aW5lZnF6b2VxbG5kbmN4bGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NjUzMjYsImV4cCI6MjA4NzU0MTMyNn0.McwnrFtCdLH6-NGAmzuUcx1JSVxYnC9dtDViGUi1S1M';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];

        async function init() {
            try {
                const { data, error } = await _supabase.from('products').select('*');
                if (error) throw error;
                
                allProducts = data;
                document.getElementById('loader').classList.add('hidden');
                renderCategories();
            } catch (err) {
                document.getElementById('loader').innerHTML = "ОШИБКА ПОДКЛЮЧЕНИЯ";
                console.error(err);
            }
        }

        function renderCategories() {
            const menu = document.getElementById('categoryMenu');
            // Очищаем категории от лишних пробелов для точности
            const categories = [...new Set(allProducts.map(p => (p.category || 'Общее').trim()))];
            
            menu.innerHTML = '';
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'category-bubble';
                div.innerHTML = `<span>${cat}</span>`;
                div.onclick = () => showProducts(cat);
                menu.appendChild(div);
            });
            
            toggleView('categories');
        }

        function showProducts(category) {
            const container = document.getElementById('shop-container');
            container.innerHTML = '';
            
            const filtered = allProducts.filter(p => (p.category || 'Общее').trim() === category);
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const img = item.image_url || 'https://via.placeholder.com/400x300/1a2a40/00f2ff?text=Digital+Noir';
                
                card.innerHTML = `
                    <img src="${img}">
                    <h2>${item.name}</h2>
                    <div class="price">${item.price} ₽</div>
                    <div class="card-description">${item.description || 'Описание в разработке...'}</div>
                    <button class="buy-btn" onclick="order('${item.name}')">КУПИТЬ</button>
                `;
                container.appendChild(card);
            });
            
            toggleView('products');
        }

        function toggleView(view) {
            document.getElementById('categoryMenu').classList.toggle('hidden', view !== 'categories');
            document.getElementById('shop-container').classList.toggle('hidden', view !== 'products');
            document.getElementById('profile-page').classList.toggle('hidden', view !== 'profile');
            document.getElementById('backBtn').style.display = (view === 'categories') ? 'none' : 'block';
        }

        function showProfile() { toggleView('profile'); }
        function goBack() { toggleView('categories'); }

        function order(name) {
            tg.sendData("buy_" + name);
            tg.close();
        }

        init();
    </script>
</body>
</html>
